name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instala uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Builda o pacote (wheel + sdist)
        run: uv build

      - name: Publica release no GitHub com os artefatos
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
