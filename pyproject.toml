[project]
name = "vinea"
version = "0.5.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "José de Jesus Filho", email = "jjesusfilho@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3.2",
    "pandas>=2.3.3",
    "pyodbc>=5.2.0",
    "pyspark>=4.0.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "sqlalchemy>=2.0.43",
    "zeep>=4.3.1",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pdfplumber>=0.11.0",
    "pypdf>=6.9.2",
    "pdfminer-six>=20251230",
]

[project.optional-dependencies]
# Só para FabricJobClient (execução remota de notebooks). Mantido fora das
# dependências principais de propósito: instalar azure-identity dentro de um
# notebook do Fabric (via %pip install vinea) pode colidir com a versão de
# azure-core/azure-storage-blob que o próprio runtime Spark do Fabric usa
# internamente (ex.: RemoteShuffleManagerGluten), derrubando a sessão inteira.
# Use `vinea[fabric]` só em ambientes fora do Fabric (orquestradores locais).
fabric = [
    "azure-identity>=1.25.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "vinea[fabric]",
]

[tool.uv.sources]
vinea = { workspace = true }