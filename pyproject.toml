[project]
name = "vinea"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "José de Jesus Filho", email = "jjesusfilho@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25.3",
    "duckdb>=1.3.2",
    "pandas>=2.3.3",
    "pyodbc>=5.2.0",
    "pyspark>=4.0.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "sqlalchemy>=2.0.43",
    "zeep>=4.3.1",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pdfplumber>=0.11.0",
    "pypdf>=6.9.2",
    "pdfminer-six>=20251230",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "vinea",
]

[tool.uv.sources]
vinea = { workspace = true }