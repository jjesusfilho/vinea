[project]
name = "vinea"
version = "0.18.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "José de Jesus Filho", email = "jjesusfilho@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "python-dotenv>=1.1.1",
    "requests>=2.31",
    "zeep>=4.3.1",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pdfplumber>=0.11.0",
    "pypdf>=6.9.2",
    "pdfminer-six>=20251230",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
# Dependências que o código-fonte do vinea não importa (ou só importa de forma
# tardia, para tipagem) e que, instaladas dentro de um notebook ou ambiente do
# Fabric, arriscam colidir com o runtime (o pyspark>=4 exigido antes é mais novo
# que o Spark 3.5 do Runtime 1.3; a colisão não foi confirmada, só evitada).
# Quem precisar delas fora do Fabric instala o extra correspondente.
spark = ["pyspark>=3.5"]
sql = ["duckdb>=1.3.2", "pyodbc>=5.2.0", "sqlalchemy>=2.0.43"]
# Só para FabricJobClient (execução remota de notebooks). Mantido fora das
# dependências principais de propósito: instalar azure-identity dentro de um
# notebook do Fabric (via %pip install vinea) pode colidir com a versão de
# azure-core/azure-storage-blob que o próprio runtime Spark do Fabric usa
# internamente (ex.: RemoteShuffleManagerGluten), derrubando a sessão inteira.
# Use `vinea[fabric]` só em ambientes fora do Fabric (orquestradores locais).
fabric = [
    "azure-identity>=1.25.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "vinea[fabric,spark,sql]",
]

[tool.uv.sources]
vinea = { workspace = true }
